# Scene v3 (2026-10-11) = v2 visuals + object-physics corrections (src/simulation/env.py::apply_physics):
#   pots: 60 % of the (unchanged) mass in the bottom disk (thick encapsulated steel base -> low centre of mass;
#         the v1/v2 builder spread the mass uniformly, putting ~91 % in the walls);
#   pots/lids: friction 0.4 + contact priority 1 (steel on wood ~0.3-0.5; was max(1.0 table, 1.0) = 1.0). Pads keep 1.5
#         with contact priority, so grasps are unaffected. Masses, sizes, cubes and solref/solimp unchanged.
# Values are literature-typical, not measured on the real objects. Select with SO101_SIM_CONFIG=configs/simulation_v3.yaml.
# profile position_wide (2026-10-12, for sim data v3): position_visual + per-object r/theta ranges widened by
#   +-2 cm / +-15 deg (clipped to the workspace; pots r <= 0.25 m) and yaw +-45 deg; train cells of the split only.
control:
  fps: 30
  physics_timestep: 0.0016666667
  action: canonical_degrees
cameras:
  top:
    width: 640
    height: 360
    fovy: 60
    pos:
    - -0.22
    - -0.24
    - 0.52
    target:
    - 0.18
    - -0.36
    - 0.0
  wrist:
    width: 640
    height: 480
    fovy: 75
    body: wrist_camera
    pos:
    - 0.0
    - 0.0
    - 0.025
    quat:
    - 0
    - 1
    - 0
    - 0
position_split:
  cell_dr: 0.04
  cell_dtheta: 15.0
  labels:
    train:
    - 0
    - 1
    - 2
    val:
    - 3
    test:
    - 4
workspace:
  r_min: 0.13
  r_max: 0.29
  theta_min: -60.0
  theta_max: 70.0
  min_separation: 0.015
  keepout:
    x:
    - 0.07
    - 0.215
    y:
    - -0.06
    - 0.06
profiles:
  fixed:
    randomize_positions: false
    yaw_range_deg: 0
    visual: false
  position:
    randomize_positions: true
    yaw_range_deg: 20
    visual: false
  position_visual:
    randomize_positions: true
    yaw_range_deg: 20
    visual: true
    light_intensity_scale: &id001
    - 0.75
    - 1.25
    table_color_jitter: 0.06
    object_color_jitter: 0.05
    camera_pos_noise: 0.01
    camera_fovy_noise: 2.0
    image_noise_std: 2.0
  position_wide:
    randomize_positions: true
    yaw_range_deg: 45
    visual: true
    light_intensity_scale: *id001
    table_color_jitter: 0.06
    object_color_jitter: 0.05
    camera_pos_noise: 0.01
    camera_fovy_noise: 2.0
    image_noise_std: 2.0
    widen:
      dr: 0.02
      dth: 15.0
      container_r_max: 0.25
episode:
  max_seconds: 30
  success_hold_steps: 10
appearance:
  robot_rgba:
  - 0.25
  - 0.78
  - 0.85
  - 1
  table_yaw_deg: -20
  leader_prop:
  - - - -0.17
      - -0.5
      - 0.06
    - - 0.05
      - 0.035
      - 0.06
  - - - -0.13
      - -0.48
      - 0.13
    - - 0.03
      - 0.03
      - 0.03
physics:
  container_bottom_mass_fraction: 0.6
  container_friction:
  - 0.4
  - 0.005
  - 0.0001
